name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Lint and unit tests
        run: ./gradlew :app:lintRelease :app:testDebugUnitTest --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: warn

      - name: Prepare signing (only if all secrets exist)
        id: signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=0
          for v in KS_B64 KS_PASS KEY_ALIAS KEY_PASS; do
            [ -n "${!v:-}" ] && present=$((present+1))
          done
          if [ "$present" -eq 4 ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "DROIDXAMPP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "DROIDXAMPP_KEYSTORE_PASSWORD=$KS_PASS"
              echo "DROIDXAMPP_KEY_ALIAS=$KEY_ALIAS"
              echo "DROIDXAMPP_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ "$present" -eq 0 ]; then
            echo "::warning::Secrets signing belum diisi. Membangun APK DEBUG hanya untuk uji coba (bukan untuk distribusi). Lihat docs/SIGNING.md."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Secrets signing tidak lengkap ($present dari 4). Isi keempatnya atau kosongkan semuanya. Lihat docs/SIGNING.md."
            exit 1
          fi

      - name: Build APK
        run: |
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            ./gradlew :app:assembleDebug --stacktrace
          fi

      - name: Locate and verify APK
        id: apk
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then dir=app/build/outputs/apk/release; else dir=app/build/outputs/apk/debug; fi
          shopt -s nullglob
          files=("$dir"/*.apk)
          if [ "${#files[@]}" -eq 0 ]; then echo "::error::APK tidak ditemukan di $dir"; ls -R app/build/outputs || true; exit 1; fi
          apk="${files[0]}"
          echo "Ditemukan: $apk ($(stat -c %s "$apk") bytes)"
          sha256sum "$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if [ "${{ steps.signing.outputs.mode }}" = "release" ] && grep -qi "Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::APK release ditandatangani dengan sertifikat debug."; exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidXAMPP-${{ steps.signing.outputs.mode }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
